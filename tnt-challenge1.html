<script>
try {
const {
  useState,
  useMemo
} = React;

/*
 * ════════════════════════════════════════════════════════════════════════
 *  Awana 성경퀴즈 문제 생성기  —  UI 개선용 버전 (Claude Design)
 * ════════════════════════════════════════════════════════════════════════
 *
 *  ▣ 이 파일을 Claude Design에서 열 때 지켜주세요:
 *
 *  ✅ 개선해도 되는 부분 (UI / 디자인):
 *     · [STYLE] 로 표시된 <style> 블록 안의 CSS  — 색, 폰트, 여백, 레이아웃
 *     · [UI] 로 표시된 JSX 마크업 (컨트롤 바, 시험지 헤더, 버튼, 체크박스 배치)
 *     · [UI] Item / 시험지 렌더링의 겉모습
 *     → "더 세련되게", "더 시험지답게", "컨트롤 바 정리" 등 자유롭게 개선 OK
 *
 *  ⛔ 절대 바꾸면 안 되는 부분 (로직 — 바꾸면 문제 생성이 깨집니다):
 *     · [DATA]  HANDBOOKS 데이터 (성경 구절·어휘 원본)
 *     · [ENGINE] 유틸 / Picker / MC / SP / WR / CLOZE / HARD / buildSet
 *     · useState/useMemo 훅의 "동작"과 buildSet 호출 방식
 *     · 각 문제 객체의 필드명 (q, a, tag, src, blanks, match2col, no)
 *       → 화면에 뿌리는 값의 "이름"은 그대로 두고, 감싸는 마크업·스타일만 바꾸세요.
 *
 *  ▣ 안전 수칙:
 *     · JSX 안에서 값을 꺼내 쓰는 표현식 { it.q }, { sec.items } 등은 유지.
 *     · className 이름은 바꿔도 되지만, 바꾸면 대응하는 CSS도 같이 바꿔야 함.
 *     · 새 컨트롤(정렬·테마 토글 등) UI는 추가해도 되나, 그 값이 buildSet의
 *       동작을 바꾸지 않도록 (순수 표시용으로) 하세요.
 *
 *  ▣ 개선이 끝나면:
 *     이 .jsx 파일을 그대로 저장해서 원래 작업하던 곳으로 가져가면,
 *     GitHub Pages 배포용 index.html 로 다시 빌드해 드립니다.
 * ════════════════════════════════════════════════════════════════════════
 */

// ⛔ [DATA] 성경 구절·어휘 원본 데이터 — 절대 수정하지 마세요
// 데이터는 data/ 폴더의 CSV에서 불러옵니다 (loadHandbook 참조)
let HANDBOOKS = {};
let HANDBOOK_ORDER = [];

// ==================== CSV 파서 ====================
function parseCSV(text) {
  const rows = [];
  let row = [],
    field = "",
    inQuotes = false;
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  for (let i = 0; i < text.length; i++) {
    const c = text[i],
      next = text[i + 1];
    if (inQuotes) {
      if (c === '"' && next === '"') {
        field += '"';
        i++;
      } else if (c === '"') {
        inQuotes = false;
      } else {
        field += c;
      }
    } else {
      if (c === '"') {
        inQuotes = true;
      } else if (c === ",") {
        row.push(field);
        field = "";
      } else if (c === "\r") {/* skip */} else if (c === "\n") {
        row.push(field);
        rows.push(row);
        row = [];
        field = "";
      } else {
        field += c;
      }
    }
  }
  if (field.length || row.length) {
    row.push(field);
    rows.push(row);
  }
  if (!rows.length) return [];
  const header = rows[0];
  return rows.slice(1).filter(r => r.some(c => c !== "")).map(r => {
    const o = {};
    header.forEach((h, i) => {
      o[h] = r[i] !== undefined ? r[i] : "";
    });
    return o;
  });
}

// T&T 한 핸드북의 CSV 2종(본문·어휘)을 불러와 구조화
async function loadHandbook(slug, displayName) {
  const base = "data/tnt_" + slug + "_";
  const [vText, wText] = await Promise.all([fetch(base + "verses.csv").then(r => r.text()), fetch(base + "words.csv").then(r => r.text())]);
  const rows = parseCSV(vText).map(r => ({
    ID: r.ID,
    질문번호: parseInt(r.질문번호, 10),
    질문: r.질문,
    답번호: parseInt(r.답번호, 10),
    답: r.답,
    책: r.책,
    장절: r.장절,
    말씀: r.말씀,
    키워드: (r.핵심단어 || "").split(",").map(s => s.trim()).filter(Boolean)
  }));
  const vocabs = parseCSV(wText).map(r => ({
    ID: r.ID,
    말씀ID: r.말씀ID || null,
    용어: r.용어,
    정의: r.정의
  }));
  return {
    rows,
    vocabs
  };
}

// ⛔⛔⛔ [ENGINE] 아래부터 buildSet 끝까지는 문제 생성 로직입니다 ⛔⛔⛔
// ⛔ 이 영역(유틸·Picker·MC·SP·WR·CLOZE·HARD·buildSet)은 수정하지 마세요.
// ⛔ UI에서 쓰는 값(q, a, tag, src, blanks, match2col)의 이름이 여기서 정해집니다.

// ==================== [ENGINE] 유틸 ====================
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0;
    a = a + 0x6d2b79f5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const makeRng = seed => {
  const rand = mulberry32(seed);
  return {
    rand,
    int: n => Math.floor(rand() * n),
    choice: arr => arr[Math.floor(rand() * arr.length)],
    sample: (arr, n) => {
      const c = [...arr];
      for (let i = c.length - 1; i > 0; i--) {
        const j = Math.floor(rand() * (i + 1));
        [c[i], c[j]] = [c[j], c[i]];
      }
      return c.slice(0, n);
    },
    shuffle: arr => {
      const c = [...arr];
      for (let i = c.length - 1; i > 0; i--) {
        const j = Math.floor(rand() * (i + 1));
        [c[i], c[j]] = [c[j], c[i]];
      }
      return c;
    }
  };
};
const refKo = (book, ref) => {
  const unit = book === "시편" ? "편" : "장";
  if (!ref.includes(":")) return `${book} ${ref}`;
  const [ch, vs] = ref.split(/:(.+)/);
  return `${book} ${ch}${unit} ${vs.trim()}절`;
};
const rowRef = r => refKo(r.책, r.장절);
const splitVerse = text => {
  const w = text.split(" ");
  const mid = Math.max(1, Math.floor(w.length / 2));
  return [w.slice(0, mid).join(" "), w.slice(mid).join(" ")];
};
const blankText = (text, kws, hole = "(이것)") => {
  let out = text;
  for (const kw of kws) out = out.replace(kw, hole);
  return out;
};

// 핵심단어를 (1)(2)... 번호로 치환하고, 하단 답칸 데이터를 함께 반환
const numberedBlanks = (text, blanks) => {
  // blanks: [{surface}] 순서대로 본문에서 치환
  let out = text;
  const answers = [];
  blanks.forEach((b, i) => {
    const n = i + 1;
    if (out.includes(b.surface)) {
      out = out.replace(b.surface, `(${n})`);
      answers.push({
        no: n,
        text: b.answer !== undefined ? b.answer : b.surface
      });
    }
  });
  return {
    text: out,
    answers
  };
};

// ==================== 선택 엔진 ====================
class Picker {
  constructor(rows, vocabs, rng, allRows, allVocabs) {
    this.rows = rows;
    this.vocabs = vocabs;
    this.rng = rng;
    // 오답/보기 후보용 전체 풀 (단원 필터와 무관하게 다양성 확보)
    this.allRows = allRows || rows;
    this.allVocabs = allVocabs || vocabs;
    this.usedIds = new Set();
    this.usedVocab = new Set();
    this.qCount = {};
    this.vocabLinked = vocabs.length > 0 && vocabs.every(v => v.말씀ID);
  }
  pickRow(cond) {
    let cands = this.rows.filter(r => !this.usedIds.has(r.ID) && (!cond || cond(r)));
    if (!cands.length) cands = this.rows.filter(r => !cond || cond(r));
    if (!cands.length) cands = this.rows.filter(r => !this.usedIds.has(r.ID)); // 조건 무시
    if (!cands.length) cands = this.rows; // 최종: 무엇이든
    const least = Math.min(...cands.map(r => this.qCount[r.질문번호] || 0));
    cands = cands.filter(r => (this.qCount[r.질문번호] || 0) === least);
    const r = this.rng.choice(cands);
    this.usedIds.add(r.ID);
    this.qCount[r.질문번호] = (this.qCount[r.질문번호] || 0) + 1;
    return r;
  }
  pickVocab() {
    let cands = this.vocabs.filter(v => !this.usedVocab.has(v.ID));
    if (!cands.length) cands = this.vocabs;
    const v = this.rng.choice(cands);
    this.usedVocab.add(v.ID);
    return v;
  }
  rowById(id) {
    return this.allRows.find(r => r.ID === id);
  }
  answerRows(r) {
    return this.rows.filter(x => x.질문번호 === r.질문번호 && x.답번호 === r.답번호);
  }
  otherRows(r, n, sameQ = false) {
    // 오답 후보는 전체 풀에서 (단원을 좁혀도 보기 다양성 유지)
    let pool = this.allRows.filter(x => x.ID !== r.ID && !(x.질문번호 === r.질문번호 && x.답번호 === r.답번호));
    if (sameQ) {
      const sq = pool.filter(x => x.질문번호 === r.질문번호);
      if (sq.length >= n) pool = sq;
    }
    const seen = new Set();
    const out = [];
    for (const x of this.rng.shuffle(pool)) {
      const key = `${x.질문번호}-${x.답번호}`;
      if (!seen.has(key)) {
        seen.add(key);
        out.push(x);
      }
      if (out.length === n) break;
    }
    return out;
  }
}
const mcOptions = (rng, correct, distractors) => {
  const opts = rng.shuffle([correct, ...distractors]);
  const labels = "ABC";
  return {
    lines: opts.map((o, i) => `${labels[i]}) ${o}`),
    ans: labels[opts.indexOf(correct)]
  };
};
const trimDot = s => s.replace(/\.$/, "");

// ==================== 객관식 ====================
const MC = {
  themeQuestion(p) {
    const r = p.pickRow();
    const refs = p.answerRows(r).map(rowRef).join(", ");
    const qs = [...new Set(p.rows.map(x => x.질문))];
    const d = p.rng.sample(qs.filter(q => q !== r.질문), 2);
    const {
      lines,
      ans
    } = mcOptions(p.rng, r.질문, d);
    return {
      tag: "주제질문 찾기",
      q: [`[핸드북의 주제를 묻는 문제입니다.] '${refs}'는 하나의 답을 뒷받침합니다. 이 답에 대한 주제 질문은 무엇인가요?`, ...lines],
      a: [`정답) ${ans} — ${r.질문}`],
      src: `${r.ID}`
    };
  },
  completeVerse(p) {
    const r = p.pickRow(x => x.말씀.split(" ").length >= 10);
    const back = splitVerse(r.말씀)[1];
    const d = p.otherRows(r, 2).map(x => splitVerse(x.말씀)[1]);
    const {
      lines,
      ans
    } = mcOptions(p.rng, back, d);
    return {
      tag: "뒷부분 완성",
      q: [`[성경구절의 뒷부분을 완성하는 문제입니다.] '${rowRef(r)}'에 나오는 말씀은 무엇인가요?`, ...lines],
      a: [`정답) ${ans}`],
      src: `${r.ID} ${rowRef(r)}`
    };
  },
  matchPair(p) {
    const r = p.pickRow();
    const [o1, o2] = p.otherRows(r, 2);
    const correct = `${trimDot(r.답)} – ${rowRef(r)}`;
    const {
      lines,
      ans
    } = mcOptions(p.rng, correct, [`${trimDot(o1.답)} – ${rowRef(o2)}`, `${trimDot(o2.답)} – ${rowRef(o1)}`]);
    return {
      tag: "답–출처 연결",
      q: ["[성경구절의 출처를 묻는 문제입니다.] 주제질문에 대한 대답과 출처가 알맞게 연결된 것은 무엇인가요?", ...lines],
      a: [`정답) ${ans} — ${correct}`],
      src: r.ID
    };
  },
  wordMeaning(p) {
    const v = p.pickVocab();
    const d = p.rng.sample(p.allVocabs.filter(x => x.ID !== v.ID), 2).map(x => x.정의);
    const {
      lines,
      ans
    } = mcOptions(p.rng, v.정의, d);
    const r = v.말씀ID ? p.rowById(v.말씀ID) : null;
    // 구절 본문을 보여주고, 그 안의 단어 뜻을 물음 (출처는 묻지 않음)
    if (r) {
      return {
        tag: "단어 의미",
        q: [`[다음 말씀을 읽고, '${v.용어}'의 의미로 알맞은 것을 고르세요.]`, `"${r.말씀}"`, ...lines],
        a: [`정답) ${ans} — ${v.정의}`],
        src: v.말씀ID
      };
    }
    return {
      tag: "단어 의미",
      q: [`['${v.용어}'의 의미로 알맞은 것을 고르세요.]`, ...lines],
      a: [`정답) ${ans} — ${v.정의}`],
      src: v.ID
    };
  },
  findAnswer(p) {
    const r = p.pickRow();
    const d = p.otherRows(r, 2, true).map(x => x.답);
    const {
      lines,
      ans
    } = mcOptions(p.rng, r.답, d);
    return {
      tag: "답 찾기",
      q: [`[핸드북 주제질문에 대한 답을 묻는 문제입니다.] "${r.질문}"에 대한 '${rowRef(r)}'은 하나의 답을 뒷받침합니다. 이 주제질문에 대한 답은 무엇인가요?`, ...lines],
      a: [`정답) ${ans} — ${r.답}`],
      src: `${r.ID} ${rowRef(r)}`
    };
  },
  findSource(p) {
    const r = p.pickRow();
    const d = p.otherRows(r, 2).map(rowRef);
    const {
      lines,
      ans
    } = mcOptions(p.rng, rowRef(r), d);
    return {
      tag: "출처 찾기",
      q: [`[성경구절의 출처를 묻는 문제입니다.] "${trimDot(r.답)}"를 뒷받침해 주는 성경구절은 무엇인가요?`, ...lines],
      a: [`정답) ${ans} — ${rowRef(r)}`],
      src: r.ID
    };
  },
  findSourceByStart(p) {
    const r = p.pickRow(x => x.말씀.split(" ").length >= 6);
    const start = r.말씀.split(" ").slice(0, 3).join(" ");
    const d = p.otherRows(r, 2).map(rowRef);
    const {
      lines,
      ans
    } = mcOptions(p.rng, rowRef(r), d);
    return {
      tag: "출처 찾기(시작구절)",
      q: [`[성경구절의 출처를 묻는 문제입니다.] "${r.질문}"에 대한 하나의 답을 뒷받침하며 '${start}'…로 시작하는 성경구절은 무엇인가요?`, ...lines],
      a: [`정답) ${ans} — ${rowRef(r)}`],
      src: r.ID
    };
  },
  memorizeOrder(p) {
    const r = p.pickRow(x => x.키워드.length >= 3);
    const kws = r.키워드.slice(0, 4);
    const correct = kws.join(", ");
    const perms = new Set();
    let guard = 0;
    while (perms.size < 2 && guard++ < 40) {
      const s = p.rng.shuffle(kws).join(", ");
      if (s !== correct) perms.add(s);
    }
    const {
      lines,
      ans
    } = mcOptions(p.rng, correct, [...perms]);
    return {
      tag: "암송 배열",
      q: [`[성경구절 암송 문제입니다.] 다음의 성경구절은 '${trimDot(r.답)}'를 뒷받침하는 성경구절입니다. 다음의 (이것)에 들어갈 단어를 순서대로 알맞게 배열한 것은 무엇인가요?`, `(${rowRef(r)}) "${blankText(r.말씀, kws)}"`, ...lines],
      a: [`정답) ${ans} — ${correct}`],
      src: `${r.ID} ${rowRef(r)}`
    };
  }
};

// ==================== 스피드 ====================
const SP = {
  blankWord(p) {
    const r = p.pickRow(x => x.키워드.length >= 1);
    const n = Math.min(2, r.키워드.length);
    const kws = r.키워드.slice(0, n);
    return {
      tag: "빈칸 단어",
      q: [`[다음 중 이것은 무엇인가요? 이것은 ${n}개 입니다.] '${blankText(r.말씀, kws)}'`],
      a: [`정답) ${kws.join(", ")}`],
      src: `${r.ID} ${rowRef(r)}`
    };
  },
  answerToSource(p) {
    const r = p.pickRow();
    const refs = p.answerRows(r).map(rowRef).join(" / ");
    return {
      tag: "답→출처",
      q: [`'${trimDot(r.답)}'라는 답을 뒷받침하는 성경 구절의 출처를 말하세요.`],
      a: [`정답) ${refs}`],
      src: r.ID
    };
  },
  sourceToQuestion(p) {
    const r = p.pickRow();
    return {
      tag: "출처→주제질문",

      a: [`정답) 아래 ${all.length}가지 중 4가지:`, ...all.map(([i, t]) => `${i}. ${t}`)],

const FIXED_HOLE = "(______  ______)"; // 넉넉한 고정 빈칸 (글자수 힌트 없음)

const CLOZE = {
  // 1단계: 핵심단어만 번호 빈칸
  level1(p) {
    const r = p.pickRow(x => x.키워드.length >= 1);
    const blanks = r.키워드.map(kw => ({
      surface: kw,
      answer: kw
    }));
    const {
      text,
      answers
    } = numberedBlanks(r.말씀, blanks);
    return {
      tag: "괄호 1단계",
      q: [`다음 (번호) 안에 알맞은 말을 아래에 쓰세요. [${rowRef(r)}]`, `"${text}"`],
      blanks: answers,
      a: [`정답) ${answers.map(x => `(${x.no}) ${x.text}`).join(" / ")}`],
      src: r.ID
    };
  },
  // 2단계: 구문을 곳곳에 번호 빈칸
  level2(p) {
    const r = p.pickRow(x => x.말씀.split(" ").length >= 8);
    const words = r.말씀.split(" ");
    const out = [];
    const answers = [];
    let i = 0,
      n = 0;
    while (i < words.length) {
      const keep = 2 + p.rng.int(2);
      for (let k = 0; k < keep && i < words.length; k++, i++) out.push(words[i]);
      if (i < words.length) {
        const gap = 1 + p.rng.int(2);
        const chunk = [];
        for (let k = 0; k < gap && i < words.length; k++, i++) chunk.push(words[i]);
        n += 1;
        answers.push({
          no: n,
          text: chunk.join(" ")
        });
        out.push(`(${n})`);
      }
    }
    return {
      tag: "괄호 2단계",
      q: [`다음 (번호) 안에 알맞은 말을 아래에 쓰세요. [${rowRef(r)}]`, `"${out.join(" ")}"`],
      blanks: answers,
      a: [`정답) ${answers.map(x => `(${x.no}) ${x.text}`).join(" / ")}`],
      src: r.ID
    };
  },
  // 3단계: 앞부분만 남기고 나머지를 번호 빈칸 여러 개
  level3(p) {
    const r = p.pickRow(x => x.말씀.split(" ").length >= 6);
    const words = r.말씀.split(" ");
    const keep = Math.min(3, Math.max(2, Math.floor(words.length / 4)));
    const shown = words.slice(0, keep).join(" ");
    const rest = words.slice(keep);
    // 나머지를 3~4조각으로 나눠 번호 부여
    const holes = Math.min(4, Math.max(2, Math.ceil(rest.length / 4)));
    const per = Math.ceil(rest.length / holes);
    const out = [shown];
    const answers = [];
    for (let h = 0; h < holes; h++) {
      const chunk = rest.slice(h * per, (h + 1) * per);
      if (!chunk.length) break;
      answers.push({
        no: h + 1,
        text: chunk.join(" ")
      });
      out.push(`(${h + 1})`);
    }
    return {
      tag: "괄호 3단계",
      q: [`다음은 '${rowRef(r)}' 말씀의 앞부분입니다. (번호) 안을 아래에 채워 완성하세요.`, `"${out.join(" ")}"`],
      blanks: answers,
      a: [`정답) ${r.말씀}`],
      src: r.ID
    };
  },
  // 4단계: 출처만 주고 본문 전체 쓰기 (빈칸 하나, 힌트 없음)
  level4(p) {
    const r = p.pickRow();
    return {
      tag: "괄호 4단계",
      q: [`'${rowRef(r)}' 말씀 전체를 (1)에 쓰세요. (출처만 보고 암송)`, `${rowRef(r)} → (1)`],
      blanks: [{
        no: 1,
        text: r.말씀
      }],
      a: [`정답) ${r.말씀}`],
      src: r.ID
    };
  }
};
// ==================== 고난도 (심화) ====================
const HARD = {
  // 출처 2~3개에 공통으로 들어가는 어휘 찾기
  commonVocab(p) {
    // 같은 용어가 여러 구절에 등장하는 경우를 찾음 (키워드 기준)
    const byWord = {};
    for (const r of p.rows) {
      for (const kw of r.키워드) {
        (byWord[kw] = byWord[kw] || []).push(r);
      }
    }
    const cands = Object.entries(byWord).filter(([, rs]) => {
      // 서로 다른 답에 속한 구절이 2개 이상
      const keys = new Set(rs.map(r => `${r.질문번호}-${r.답번호}`));
      return keys.size >= 2;
    });
    if (!cands.length) return HARD.oddOneOut(p);
    const [word, rs] = p.rng.choice(cands);
    // 서로 다른 답의 구절 2~3개 선택
    const seen = new Set();
    const picked = [];
    for (const r of p.rng.shuffle(rs)) {
      const key = `${r.질문번호}-${r.답번호}`;
      if (!seen.has(key)) {
        seen.add(key);
        picked.push(r);
      }
      if (picked.length === (p.rng.rand() < 0.5 ? 2 : 3)) break;
    }
    const refs = picked.map(rowRef).join(", ");
    return {
      tag: "공통 어휘",
      q: [`다음 성경구절들에 공통으로 들어가는 낱말은 무엇인가요? — ${refs}`],
      a: [`정답) ${word}`],
      src: picked.map(r => r.ID).join(",")
    };
  },
  // 답 3개 중 다른 주제질문에 속한 하나 골라내기
  oddOneOut(p) {
    const r = p.pickRow();
    const same = p.otherRows(r, 2, true).filter(x => x.질문번호 === r.질문번호);
    const diff = p.rows.filter(x => x.질문번호 !== r.질문번호);
    if (same.length < 2 || !diff.length) return HARD.keywordsToSource(p);
    const odd = p.rng.choice(diff);
    const opts = p.rng.shuffle([{
      t: r.답,
      odd: false
    }, {
      t: same[0].답,
      odd: false
    }, {
      t: odd.답,
      odd: true
    }]);
    const labels = "ABC";
    const lines = opts.map((o, i) => `${labels[i]}) ${o.t}`);
    const ans = labels[opts.findIndex(o => o.odd)];
    return {
      tag: "다른 주제 찾기",
      q: [`다음 세 답 중, 나머지 둘과 다른 주제질문에 속한 답은 무엇인가요?`, ...lines],
      a: [`정답) ${ans} — (주제: ${odd.질문})`],
      src: `${r.ID},${same[0].ID},${odd.ID}`
    };
  },
  // 핵심단어들만 나열 -> 어느 구절인지 출처 맞히기
  keywordsToSource(p) {
    const r = p.pickRow(x => x.키워드.length >= 2);
    const kws = r.키워드.join(", ");
    const distract = p.otherRows(r, 2).map(rowRef);
    const opts = p.rng.shuffle([rowRef(r), ...distract]);
    const labels = "ABC";
    const lines = opts.map((o, i) => `${labels[i]}) ${o}`);
    const ans = labels[opts.indexOf(rowRef(r))];
    return {
      tag: "핵심단어→출처",
      q: [`다음 핵심 단어들이 모두 들어 있는 성경구절의 출처는? — [ ${kws} ]`, ...lines],
      a: [`정답) ${ans} — ${rowRef(r)}`],
      src: r.ID
    };
  },
  // 여러 구절 앞부분 -> 어느 답을 뒷받침하는 그룹인지
  versesToAnswer(p) {
    // 말씀이 2개 이상인 답을 찾음
    const groups = {};
    for (const r of p.rows) {
      const key = `${r.질문번호}-${r.답번호}`;
      (groups[key] = groups[key] || []).push(r);
    }
    const multi = Object.values(groups).filter(g => g.length >= 2);
    if (!multi.length) return HARD.keywordsToSource(p);
