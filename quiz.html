function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0;
    a = a + 0x6d2b79f5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const makeRng = seed => {
  const rand = mulberry32(seed);
  return {
    rand,
    int: n => Math.floor(rand() * n),
    choice: arr => arr[Math.floor(rand() * arr.length)],
    sample: (arr, n) => {
      const c = [...arr];
      for (let i = c.length - 1; i > 0; i--) {
        const j = Math.floor(rand() * (i + 1));
        [c[i], c[j]] = [c[j], c[i]];
      }
      return c.slice(0, n);
    },
    shuffle: arr => {
      const c = [...arr];
      for (let i = c.length - 1; i > 0; i--) {
        const j = Math.floor(rand() * (i + 1));
        [c[i], c[j]] = [c[j], c[i]];
      }
      return c;
    }
  };
};

};

const splitVerse = text => {
  const w = text.split(" ");
  const mid = Math.max(1, Math.floor(w.length / 2));
  return [w.slice(0, mid).join(" "), w.slice(mid).join(" ")];
};
const blankText = (text, kws, hole = "(이것)") => {
  let out = text;
  for (const kw of kws) out = out.replace(kw, hole);
  return out;
};

// 핵심단어를 (1)(2)... 번호로 치환하고, 하단 답칸 데이터를 함께 반환
const numberedBlanks = (text, blanks) => {
  // blanks: [{surface}] 순서대로 본문에서 치환
  let out = text;
  const answers = [];
  blanks.forEach((b, i) => {
    const n = i + 1;
    if (out.includes(b.surface)) {
      out = out.replace(b.surface, `(${n})`);
      answers.push({
        no: n,
        text: b.answer !== undefined ? b.answer : b.surface
      });
    }
  });
  return {
    text: out,
    answers
  };
};

// ==================== 선택 엔진 ====================
class Picker {
  constructor(rows, vocabs, rng) {
    this.rows = rows;
    this.vocabs = vocabs;
    this.rng = rng;
    this.usedIds = new Set();
    this.usedVocab = new Set();
    this.qCount = {};
    // 어휘가 말씀에 연결되어 있는지 (챌린지=연결, 어드벤처=미연결)
    this.vocabLinked = vocabs.length > 0 && vocabs.every(v => v.말씀ID);
  }
  pickRow(cond) {
    let cands = this.rows.filter(r => !this.usedIds.has(r.ID) && (!cond || cond(r)));
    if (!cands.length) cands = this.rows.filter(r => !cond || cond(r));
    const least = Math.min(...cands.map(r => this.qCount[r.질문번호] || 0));
    cands = cands.filter(r => (this.qCount[r.질문번호] || 0) === least);
    const r = this.rng.choice(cands);
    this.usedIds.add(r.ID);
    this.qCount[r.질문번호] = (this.qCount[r.질문번호] || 0) + 1;
    return r;
  }
  pickVocab() {
    let cands = this.vocabs.filter(v => !this.usedVocab.has(v.ID));
    if (!cands.length) cands = this.vocabs;
    const v = this.rng.choice(cands);
    this.usedVocab.add(v.ID);
    return v;
  }
  rowById(id) {
    return this.rows.find(r => r.ID === id);
  }
  answerRows(r) {
    return this.rows.filter(x => x.질문번호 === r.질문번호 && x.답번호 === r.답번호);
  }
  otherRows(r, n, sameQ = false) {
    let pool = this.rows.filter(x => x.ID !== r.ID && !(x.질문번호 === r.질문번호 && x.답번호 === r.답번호));
    if (sameQ) {
      const sq = pool.filter(x => x.질문번호 === r.질문번호);
      if (sq.length >= n) pool = sq;
    }
    const seen = new Set();
    const out = [];
    for (const x of this.rng.shuffle(pool)) {
      const key = `${x.질문번호}-${x.답번호}`;
      if (!seen.has(key)) {
        seen.add(key);
        out.push(x);
      }
      if (out.length === n) break;
    }
    return out;
  }
}
const mcOptions = (rng, correct, distractors) => {
  const opts = rng.shuffle([correct, ...distractors]);
  const labels = "ABC";
  return {
    lines: opts.map((o, i) => `${labels[i]}) ${o}`),
    ans: labels[opts.indexOf(correct)]
  };
};
const trimDot = s => s.replace(/\.$/, "");

// ==================== 객관식 ====================
const MC = {
  themeQuestion(p) {
    const r = p.pickRow();
    const refs = p.answerRows(r).map(rowRef).join(", ");
    const qs = [...new Set(p.rows.map(x => x.질문))];
    const d = p.rng.sample(qs.filter(q => q !== r.질문), 2);
    const {
      lines,
      ans
    } = mcOptions(p.rng, r.질문, d);
    return {
      tag: "주제질문 찾기",
      q: [`[핸드북의 주제를 묻는 문제입니다.] '${refs}'는 하나의 답을 뒷받침합니다. 이 답에 대한 주제 질문은 무엇인가요?`, ...lines],
      a: [`정답) ${ans} — ${r.질문}`],
      src: `${r.ID}`
    };
  },
  completeVerse(p) {
    const r = p.pickRow(x => x.말씀.split(" ").length >= 10);
    const back = splitVerse(r.말씀)[1];
    const d = p.otherRows(r, 2).map(x => splitVerse(x.말씀)[1]);
    const {
      lines,
      ans
    } = mcOptions(p.rng, back, d);
    return {
      tag: "뒷부분 완성",
      q: [`[성경구절의 뒷부분을 완성하는 문제입니다.] '${rowRef(r)}'에 나오는 말씀은 무엇인가요?`, ...lines],
      a: [`정답) ${ans}`],
      src: `${r.ID} ${rowRef(r)}`
    };
  },
  matchPair(p) {
    const r = p.pickRow();
    const [o1, o2] = p.otherRows(r, 2);
    const correct = `${trimDot(r.답)} – ${rowRef(r)}`;
    const {
      lines,
      ans
    } = mcOptions(p.rng, correct, [`${trimDot(o1.답)} – ${rowRef(o2)}`, `${trimDot(o2.답)} – ${rowRef(o1)}`]);
    return {
      tag: "답–출처 연결",
      q: ["[성경구절의 출처를 묻는 문제입니다.] 주제질문에 대한 대답과 출처가 알맞게 연결된 것은 무엇인가요?", ...lines],
      a: [`정답) ${ans} — ${correct}`],
      src: r.ID
    };
  },
  wordMeaning(p) {
    const v = p.pickVocab();
    const d = p.rng.sample(p.vocabs.filter(x => x.ID !== v.ID), 2).map(x => x.정의);
    const {
      lines,
      ans
    } = mcOptions(p.rng, v.정의, d);
    const r = v.말씀ID ? p.rowById(v.말씀ID) : null;
    // 구절 본문을 보여주고, 그 안의 단어 뜻을 물음 (출처는 묻지 않음)
    if (r) {
      return {
        tag: "단어 의미",
        q: [`[다음 말씀을 읽고, '${v.용어}'의 의미로 알맞은 것을 고르세요.]`, `"${r.말씀}"`, ...lines],
        a: [`정답) ${ans} — ${v.정의}`],
        src: v.말씀ID
      };
    }
    return {
      tag: "단어 의미",
      q: [`['${v.용어}'의 의미로 알맞은 것을 고르세요.]`, ...lines],
      a: [`정답) ${ans} — ${v.정의}`],
      src: v.ID
    };
  },
  findAnswer(p) {
    const r = p.pickRow();
    const d = p.otherRows(r, 2, true).map(x => x.답);
    const {
      lines,
      ans
    } = mcOptions(p.rng, r.답, d);
    return {
      tag: "답 찾기",
      q: [`[핸드북 주제질문에 대한 답을 묻는 문제입니다.] "${r.질문}"에 대한 '${rowRef(r)}'은 하나의 답을 뒷받침합니다. 이 주제질문에 대한 답은 무엇인가요?`, ...lines],
      a: [`정답) ${ans} — ${r.답}`],
      src: `${r.ID} ${rowRef(r)}`
    };
  },
  findSource(p) {
    const r = p.pickRow();
    const d = p.otherRows(r, 2).map(rowRef);
    const {
      lines,
      ans
    } = mcOptions(p.rng, rowRef(r), d);
    return {
      tag: "출처 찾기",
      q: [`[성경구절의 출처를 묻는 문제입니다.] "${trimDot(r.답)}"를 뒷받침해 주는 성경구절은 무엇인가요?`, ...lines],
      a: [`정답) ${ans} — ${rowRef(r)}`],
      src: r.ID
    };
  },
  findSourceByStart(p) {
    const r = p.pickRow(x => x.말씀.split(" ").length >= 6);
    const start = r.말씀.split(" ").slice(0, 3).join(" ");
    const d = p.otherRows(r, 2).map(rowRef);
    const {
      lines,
      ans
    } = mcOptions(p.rng, rowRef(r), d);
    return {
      tag: "출처 찾기(시작구절)",
      q: [`[성경구절의 출처를 묻는 문제입니다.] "${r.질문}"에 대한 하나의 답을 뒷받침하며 '${start}'…로 시작하는 성경구절은 무엇인가요?`, ...lines],
      a: [`정답) ${ans} — ${rowRef(r)}`],
      src: r.ID
    };
  },
  memorizeOrder(p) {
    const r = p.pickRow(x => x.키워드.length >= 3);
    const kws = r.키워드.slice(0, 4);
    const correct = kws.join(", ");
    const perms = new Set();
    let guard = 0;
    while (perms.size < 2 && guard++ < 40) {
      const s = p.rng.shuffle(kws).join(", ");
      if (s !== correct) perms.add(s);
    }
    const {
      lines,
      ans
    } = mcOptions(p.rng, correct, [...perms]);
    return {
      tag: "암송 배열",
      q: [`[성경구절 암송 문제입니다.] 다음의 성경구절은 '${trimDot(r.답)}'를 뒷받침하는 성경구절입니다. 다음의 (이것)에 들어갈 단어를 순서대로 알맞게 배열한 것은 무엇인가요?`, `(${rowRef(r)}) "${blankText(r.말씀, kws)}"`, ...lines],
      a: [`정답) ${ans} — ${correct}`],
      src: `${r.ID} ${rowRef(r)}`
    };
  }
};

const SP = {

      a: [`정답) ${rowRef(r)} / ${r.말씀}`],
      src: r.ID
    };
  },
  questionSourceToAnswer(p) {
    const r = p.pickRow();
    return {
      tag: "질문+출처→답",
      q: [`'${r.질문}'라는 주제 질문에 대한 답 중에서 '${rowRef(r)}' 말씀이 뒷받침하는 답은 무엇인가요?`],
      a: [`정답) ${r.답}`],
      src: r.ID

  },
  quoteToSource(p) {
    const r = p.pickRow(x => x.말씀.split(" ").length >= 10);
    const w = r.말씀.split(" ");
    const start = Math.floor(w.length / 3);
    const quote = w.slice(start, start + 4 + p.rng.int(5)).join(" ");
    return {
      tag: "인용→출처",
      q: [`'${r.질문}'라는 주제 질문에 대한 답 중 하나를 뒷받침하며 '${quote}'라는 말씀이 들어 있는 성경구절의 출처는 무엇인가요?`],
      a: [`정답) ${rowRef(r)}`],

      a: [`정답) X (올바른 출처: ${rowRef(r)})`],

    };
  },
  completeBack(p) {

  },
  writeQA(p) {

      tag: "Q/A 쓰기",
      q: [`여러분이 암송한 '${rowRef(r)}'은 어떤 질문에 대한 어떤 답을 뒷받침하는지 쓰세요.`, "(Q / 주제질문) ＿＿＿＿＿＿", "(A / 답) ＿＿＿＿＿＿"],
      a: [`정답) Q: ${r.질문} / A: ${r.답}`],
      src: r.ID
    };
  },
  matchWords(p) {
    const vs = [];
    const seen = new Set();

      if (!seen.has(v.ID)) {

    }
    const labels = "가나다라";
    const order = p.rng.shuffle([0, 1, 2, 3]);
    // 좌열: 용어(1~4), 우열: 정의(가~라, 섞인 순서)
    const left = vs.map((v, i) => ({

    return {

      a: [`정답) ${v.정의}`],

  },
  commonWord(p) {
    const pairs = [];
    for (let i = 0; i < p.rows.length; i++) for (let j = i + 1; j < p.rows.length; j++) {
      const a = p.rows[i],
        b = p.rows[j];
      if (a.질문번호 === b.질문번호 && a.답번호 === b.답번호) continue;
      const common = a.키워드.filter(k => b.키워드.includes(k));
      if (common.length) pairs.push([a, b, common[0]]);

    if (!pairs.length) return WR.fillBlanks(p); // 공통 낱말 없으면 대체
