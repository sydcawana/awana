// ==================== 유틸 ====================
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0;
    a = a + 0x6d2b79f5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const makeRng = seed => {
  const rand = mulberry32(seed);
  return {
    rand,
    int: n => Math.floor(rand() * n),
    choice: arr => arr[Math.floor(rand() * arr.length)],
    sample: (arr, n) => {
      const c = [...arr];
      for (let i = c.length - 1; i > 0; i--) {
        const j = Math.floor(rand() * (i + 1));
        [c[i], c[j]] = [c[j], c[i]];
      }
      return c.slice(0, n);
    },
    shuffle: arr => {
      const c = [...arr];
      for (let i = c.length - 1; i > 0; i--) {
        const j = Math.floor(rand() * (i + 1));
        [c[i], c[j]] = [c[j], c[i]];
      }
      return c;
    }
  };
};
const refKo = (book, ref) => {
  const unit = book === "시편" ? "편" : "장";
  if (!ref.includes(":")) return `${book} ${ref}`;
  const [ch, vs] = ref.split(/:(.+)/);
  return `${book} ${ch}${unit} ${vs.trim()}절`;
};
const rowRef = r => refKo(r.책, r.장절);
const splitVerse = text => {
  const w = text.split(" ");
  const mid = Math.max(1, Math.floor(w.length / 2));
  return [w.slice(0, mid).join(" "), w.slice(mid).join(" ")];
};
const blankText = (text, kws, hole = "(이것)") => {
  let out = text;
  for (const kw of kws) out = out.replace(kw, hole);
  return out;
};
const numberedBlanks = (text, blanks) => {
  let out = text;
  const answers = [];
  blanks.forEach((b, i) => {
    const n = i + 1;
    if (out.includes(b.surface)) {
      out = out.replace(b.surface, `(${n})`);
      answers.push({
        no: n,
        text: b.answer !== undefined ? b.answer : b.surface
      });
    }
  });
  return {
    text: out,
    answers
  };
};
const trimDot = s => s.replace(/\.$/, "");

    this.usedIds = new Set();
    this.usedVocab = new Set();
    this.usedSW = new Set();
  }
  // 승급과정 구절 우선으로 뽑기
  pickPromoRow() {
    let cands = this.rows.filter(r => this.promoIds.has(r.ID) && !this.usedIds.has(r.ID));
    if (!cands.length) cands = this.rows.filter(r => this.promoIds.has(r.ID));
    if (!cands.length) return this.pickRow();
    const r = this.rng.choice(cands);
    this.usedIds.add(r.ID);
    return r;
  }
  pickSparksWord() {
    let cands = this.sparksWords.filter(w => !this.usedSW.has(w.글자 + w.영어));
    if (!cands.length) cands = this.sparksWords;
    const w = this.rng.choice(cands);
    this.usedSW.add(w.글자 + w.영어);
    return w;
  }
  pickRow(cond) {
    let cands = this.rows.filter(r => !this.usedIds.has(r.ID) && (!cond || cond(r)));
    if (!cands.length) cands = this.rows.filter(r => !cond || cond(r));
    if (!cands.length) cands = this.rows.filter(r => !this.usedIds.has(r.ID));
    if (!cands.length) cands = this.rows;
    const r = this.rng.choice(cands);
    this.usedIds.add(r.ID);
    return r;
  }
  pickVocab() {
    let cands = this.vocabs.filter(v => !this.usedVocab.has(v.ID));
    if (!cands.length) cands = this.vocabs;
    const v = this.rng.choice(cands);
    this.usedVocab.add(v.ID);
    return v;
  }
  rowById(id) {
    return this.rows.find(r => r.ID === id);
  }
  // 오답 후보: 다른 구절
  otherRows(r, n) {
    const pool = this.rows.filter(x => x.ID !== r.ID);
    return this.rng.sample(pool, Math.min(n, pool.length));
  }
}
const mcOptions = (rng, correct, distractors, pool) => {
  // 정답과 겹치지 않는 오답만 사용, 중복 제거
  let ds = distractors.filter(d => d !== correct);
  ds = [...new Set(ds)];
  // 부족하면 pool(문자열 배열)에서 보충
  if (pool) {
    for (const cand of rng.shuffle(pool)) {
      if (ds.length >= 2) break;
      if (cand !== correct && !ds.includes(cand)) ds.push(cand);
    }
  }
  ds = ds.slice(0, 2);
  const opts = rng.shuffle([correct, ...ds]);
  const labels = "ABC";
  return {
    lines: opts.map((o, i) => `${labels[i]}) ${o}`),
    ans: labels[opts.indexOf(correct)]
  };
};

// ==================== 괄호 채우기 (1~4단계) ====================
const FIXED_HOLE = "(______  ______)";
const CLOZE = {
  level1(p) {
    const r = p.pickRow(x => x.키워드.length >= 1);
    const blanks = r.키워드.map(kw => ({
      surface: kw,
      answer: kw
    }));
    const {
      text,
      answers
    } = numberedBlanks(r.말씀, blanks);
    return {
      tag: "괄호 1단계",
      q: [`다음 (번호) 안에 알맞은 말을 아래에 쓰세요. [${rowRef(r)}]`, `"${text}"`],
      blanks: answers,
      a: [`정답) ${answers.map(x => `(${x.no}) ${x.text}`).join(" / ")}`],
      src: r.ID
    };
  },
  level2(p) {
    const r = p.pickRow(x => x.말씀.split(" ").length >= 6);
    const words = r.말씀.split(" ");
    const out = [];
    const answers = [];
    let i = 0,
      n = 0;
    while (i < words.length) {
      const keep = 2 + p.rng.int(2);
      for (let k = 0; k < keep && i < words.length; k++, i++) out.push(words[i]);
      if (i < words.length) {
        const gap = 1 + p.rng.int(2);
        const chunk = [];
        for (let k = 0; k < gap && i < words.length; k++, i++) chunk.push(words[i]);
        n += 1;
        answers.push({
          no: n,
          text: chunk.join(" ")
        });
        out.push(`(${n})`);
      }
    }
    return {
      tag: "괄호 2단계",
      q: [`다음 (번호) 안에 알맞은 말을 아래에 쓰세요. [${rowRef(r)}]`, `"${out.join(" ")}"`],
      blanks: answers,
      a: [`정답) ${answers.map(x => `(${x.no}) ${x.text}`).join(" / ")}`],
      src: r.ID
    };
  },
  level3(p) {
    const r = p.pickRow(x => x.말씀.split(" ").length >= 5);
    const words = r.말씀.split(" ");
    const keep = Math.min(3, Math.max(2, Math.floor(words.length / 4)));
    const shown = words.slice(0, keep).join(" ");
    const rest = words.slice(keep);
    const holes = Math.min(4, Math.max(2, Math.ceil(rest.length / 4)));
    const per = Math.ceil(rest.length / holes);
    const out = [shown];
    const answers = [];
    for (let h = 0; h < holes; h++) {
      const chunk = rest.slice(h * per, (h + 1) * per);
      if (!chunk.length) break;
      answers.push({
        no: h + 1,
        text: chunk.join(" ")
      });
      out.push(`(${h + 1})`);
    }
    return {
      tag: "괄호 3단계",
      q: [`다음은 '${rowRef(r)}' 말씀의 앞부분입니다. (번호) 안을 아래에 채워 완성하세요.`, `"${out.join(" ")}"`],
      blanks: answers,
      a: [`정답) ${r.말씀}`],
      src: r.ID
    };
  },
  level4(p) {
    const r = p.pickRow();
    return {
      tag: "괄호 4단계",
      q: [`'${rowRef(r)}' 말씀 전체를 (1)에 쓰세요. (출처만 보고 암송)`, `${rowRef(r)} → (1)`],
      blanks: [{
        no: 1,
        text: r.말씀
      }],
      a: [`정답) ${r.말씀}`],
      src: r.ID
    };
  }
};

// ==================== 세트 구성 ====================
function buildSet(handbook, quizType, seed, opts = {}) {
  const hb = HANDBOOKS[handbook];
  const rows = hb.rows,
    vocabs = hb.vocabs;
  const sparksWords = hb.sparksWords || [];
  const promoIds = hb.promoIds || [];
  const rng = makeRng(seed);
  const sections = [];
  const types = quizType === "전체" ? ["필기", "객관식", "괄호채우기"] : [quizType];
  for (const t of types) {
    const p = new Picker(rows, vocabs, rng, sparksWords, promoIds);
    let items = [];
    if (t === "객관식") {
      // SPARKS 단어 2문제 + 승급과정 구절 우선 1문제 + 나머지
      items = [MC.sparksLetter(p), MC.sparksMeaning(p), MC.findSourcePromo(p),
      // 승급과정 구절 출처
      MC.completeVerse(p), MC.findSource(p), MC.findStart(p), MC.wordMeaning(p), MC.completeVerse(p)];
    } else if (t === "괄호채우기") {
      const levels = opts.clozeLevels && opts.clozeLevels.length ? opts.clozeLevels : [1, 2, 3, 4];
      const fnByLevel = {
        1: CLOZE.level1,
        2: CLOZE.level2,
        3: CLOZE.level3,
        4: CLOZE.level4
      };
      const plan = [];
      for (const lv of [1, 2, 3, 4]) {
        if (levels.includes(lv)) {
          plan.push(fnByLevel[lv], fnByLevel[lv], fnByLevel[lv]);
        }
      }
      items = plan.map(f => f(p));
    } else {
      // 필기: SPARKS 단어쓰기 + 승급과정 빈칸 우선 + 나머지
      items = [WR.sparksWordWrite(p), WR.fillBlanksPromo(p),
      // 승급과정 구절 빈칸
      WR.fillBlanks(p), WR.writeSourceVerse(p), WR.ox(p, true), WR.ox(p, false), WR.completeBack(p), WR.wordMeaningWrite(p), WR.matchWords(p), WR.fullRecite(p)];
    }
    let label;
    if (t === "필기") label = "필기시험 (10문항)";else if (t === "객관식") label = "객관식 문제 (8문항)";else {
      const lv = opts.clozeLevels && opts.clozeLevels.length ? opts.clozeLevels : [1, 2, 3, 4];
      label = `괄호 채우기 (${lv.join("·")}단계, 각 3문항)`;
    }
    sections.push({
      type: t,
      label,
      items,
      reserve: []
    });
  }
  return sections;
}
