<script>
try {
const {
  useState,
  useMemo
} = React;

// 데이터는 data/ 폴더의 CSV에서 불러옵니다 (아래 loadHandbook 참조)
let HANDBOOKS = {};
let HANDBOOK_ORDER = [];

// ==================== CSV 파서 ====================
// 간단하고 안전한 CSV 파서 (따옴표 안 쉼표/줄바꿈 처리)
function parseCSV(text) {
  const rows = [];
  let row = [],
    field = "",
    inQuotes = false;
  // BOM 제거
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  for (let i = 0; i < text.length; i++) {
    const c = text[i],
      next = text[i + 1];
    if (inQuotes) {
      if (c === '"' && next === '"') {
        field += '"';
        i++;
      } else if (c === '"') {
        inQuotes = false;
      } else {
        field += c;
      }
    } else {
      if (c === '"') {
        inQuotes = true;
      } else if (c === ",") {
        row.push(field);
        field = "";
      } else if (c === "\r") {/* skip */} else if (c === "\n") {
        row.push(field);
        rows.push(row);
        row = [];
        field = "";
      } else {
        field += c;
      }
    }
  }
  if (field.length || row.length) {
    row.push(field);
    rows.push(row);
  }
  // 첫 줄 헤더 -> 객체 배열
  if (!rows.length) return [];
  const header = rows[0];
  return rows.slice(1).filter(r => r.some(c => c !== "")).map(r => {
    const o = {};
    header.forEach((h, i) => {
      o[h] = r[i] !== undefined ? r[i] : "";
    });
    return o;
  });
}

// 한 핸드북의 CSV 3종을 불러와 HANDBOOKS 구조로 변환
async function loadHandbook(slug, displayName) {
  const base = "data/sparks_" + slug + "_";
  const [vText, wText, sText] = await Promise.all([fetch(base + "verses.csv").then(r => r.text()), fetch(base + "words.csv").then(r => r.text()), fetch(base + "sparks.csv").then(r => r.text())]);
  const verses = parseCSV(vText).map(r => ({
    ID: r.ID,
    섹션: r.섹션,
    책: r.책,
    장절: r.장절,
    말씀: r.말씀,
    키워드: (r.핵심단어 || "").split(",").map(s => s.trim()).filter(Boolean)
  }));
  const vocabs = parseCSV(wText).map(r => ({
    ID: r.ID,
    말씀ID: r.말씀ID,
    용어: r.용어,
    정의: r.정의
  }));
  const sparksWords = parseCSV(sText).map(r => ({
    글자: r.글자,
    영어: r.영어,
    발음: r.발음,
    뜻: r.뜻,
    말씀ID: r.말씀ID
  }));
  const promoIds = verses.filter(r => r.섹션 === "승급과정").map(r => r.ID);

  // 성경 지식 데이터 (공용 CSV, 실패해도 무시)
  const safeFetch = url => fetch(url).then(r => r.ok ? r.text() : "").catch(() => "");
  const [bkText, scText, ftText, crText] = await Promise.all([safeFetch("data/sparks_bible_books.csv"), safeFetch("data/sparks_bible_scope.csv"), safeFetch("data/sparks_bible_facts.csv"), safeFetch("data/sparks_creation_days.csv")]);
  const allBooks = bkText ? parseCSV(bkText).map(r => ({
    구분: r.구분,
    순번: parseInt(r.순번, 10),
    책이름: r.책이름,
    약자: r.약자
  })) : [];
  // 이 핸드북의 범위
  const scopeRows = scText ? parseCSV(scText).filter(r => r.핸드북 === slug) : [];
  const getScope = k => {
    const row = scopeRows.find(r => r.항목 === k);
    return row ? row.값 : "";
  };
  const bookScope = (getScope("성경책범위") || "").split("|").filter(Boolean); // ["구약","신약"]
  const facts = getScope("권수문답") === "Y" && ftText ? parseCSV(ftText).filter(r => r.핸드북 === slug).map(r => ({
    질문: r.질문,
    답: r.답,
    유형: r.유형
  })) : [];
  const creationDays = getScope("창조6일") === "Y" && crText ? parseCSV(crText).map(r => ({
    일: r.일,
    날: r.날,
    창조물: r.창조물
  })) : [];
  const books = allBooks.filter(b => bookScope.includes(b.구분));
  return {
    rows: verses,
    vocabs,
    sparksWords,
    promoIds,
    books,
    bookScope,
    facts,
    creationDays
  };
}

// ==================== 유틸 ====================
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0;
    a = a + 0x6d2b79f5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const makeRng = seed => {
  const rand = mulberry32(seed);
  return {
    rand,
    int: n => Math.floor(rand() * n),
    choice: arr => arr[Math.floor(rand() * arr.length)],
    sample: (arr, n) => {
      const c = [...arr];
      for (let i = c.length - 1; i > 0; i--) {
        const j = Math.floor(rand() * (i + 1));
        [c[i], c[j]] = [c[j], c[i]];
      }
      return c.slice(0, n);
    },
    shuffle: arr => {
      const c = [...arr];
      for (let i = c.length - 1; i > 0; i--) {
        const j = Math.floor(rand() * (i + 1));
        [c[i], c[j]] = [c[j], c[i]];
      }
      return c;
    }
  };
};
const refKo = (book, ref) => {
  const unit = book === "시편" ? "편" : "장";
  if (!ref.includes(":")) return `${book} ${ref}`;
  const [ch, vs] = ref.split(/:(.+)/);
  return `${book} ${ch}${unit} ${vs.trim()}절`;
};
const rowRef = r => refKo(r.책, r.장절);
const splitVerse = text => {
  const w = text.split(" ");
  const mid = Math.max(1, Math.floor(w.length / 2));
  return [w.slice(0, mid).join(" "), w.slice(mid).join(" ")];
};
const blankText = (text, kws, hole = "(이것)") => {
  let out = text;
  for (const kw of kws) out = out.replace(kw, hole);
  return out;
};
const numberedBlanks = (text, blanks) => {
  let out = text;
  const answers = [];
  blanks.forEach((b, i) => {
    const n = i + 1;
    if (out.includes(b.surface)) {
      out = out.replace(b.surface, `(${n})`);
      answers.push({
        no: n,
        text: b.answer !== undefined ? b.answer : b.surface
      });
    }
  });
  return {
    text: out,
    answers
  };
};
const trimDot = s => s.replace(/\.$/, "");

// ==================== 선택 엔진 (Q/A 없음: 구절 중심) ====================
class Picker {
  constructor(rows, vocabs, rng, sparksWords, promoIds, extra) {
    this.rows = rows;
    this.vocabs = vocabs;
    this.rng = rng;
    this.sparksWords = sparksWords || [];
    this.promoIds = new Set(promoIds || []);
    this.usedIds = new Set();
    this.usedVocab = new Set();
    this.usedSW = new Set();
    extra = extra || {};
    this.books = extra.books || []; // [{구분,순번,책이름,약자}]
    this.facts = extra.facts || []; // [{질문,답,유형}]
    this.creationDays = extra.creationDays || []; // [{일,날,창조물}]
    this.usedBook = new Set();
    this.usedFact = new Set();
  }
  pickBook() {
    let cands = this.books.filter(b => !this.usedBook.has(b.구분 + b.순번));
    if (!cands.length) {
      this.usedBook.clear();
      cands = this.books;
    }
    const b = this.rng.choice(cands);
    if (b) this.usedBook.add(b.구분 + b.순번);
    return b;
  }
  pickFact() {
    let cands = this.facts.filter(f => !this.usedFact.has(f.질문));
    if (!cands.length) {
      this.usedFact.clear();
      cands = this.facts;
    }
    const f = this.rng.choice(cands);
    if (f) this.usedFact.add(f.질문);
    return f;
  }
  // 승급과정 구절 우선으로 뽑기
  pickPromoRow() {
    let cands = this.rows.filter(r => this.promoIds.has(r.ID) && !this.usedIds.has(r.ID));
    if (!cands.length) cands = this.rows.filter(r => this.promoIds.has(r.ID));
    if (!cands.length) return this.pickRow();
    const r = this.rng.choice(cands);
    this.usedIds.add(r.ID);
    return r;
  }
  pickSparksWord() {
    let cands = this.sparksWords.filter(w => !this.usedSW.has(w.글자 + w.영어));
    if (!cands.length) cands = this.sparksWords;
    const w = this.rng.choice(cands);
    this.usedSW.add(w.글자 + w.영어);
    return w;
  }
  pickRow(cond) {
    let cands = this.rows.filter(r => !this.usedIds.has(r.ID) && (!cond || cond(r)));
    if (!cands.length) cands = this.rows.filter(r => !cond || cond(r));
    if (!cands.length) cands = this.rows.filter(r => !this.usedIds.has(r.ID));
    if (!cands.length) cands = this.rows;
    const r = this.rng.choice(cands);
    this.usedIds.add(r.ID);
    return r;
  }
  pickVocab() {
    let cands = this.vocabs.filter(v => !this.usedVocab.has(v.ID));
    if (!cands.length) cands = this.vocabs;
    const v = this.rng.choice(cands);
    this.usedVocab.add(v.ID);
    return v;
  }
  rowById(id) {
    return this.rows.find(r => r.ID === id);
  }
  // 오답 후보: 다른 구절
  otherRows(r, n) {
    const pool = this.rows.filter(x => x.ID !== r.ID);
    return this.rng.sample(pool, Math.min(n, pool.length));
  }
}
const mcOptions = (rng, correct, distractors, pool) => {
  // 정답과 겹치지 않는 오답만 사용, 중복 제거
  let ds = distractors.filter(d => d !== correct);
  ds = [...new Set(ds)];
  // 부족하면 pool(문자열 배열)에서 보충
  if (pool) {
    for (const cand of rng.shuffle(pool)) {
      if (ds.length >= 2) break;
      if (cand !== correct && !ds.includes(cand)) ds.push(cand);
    }
  }
  ds = ds.slice(0, 2);
  const opts = rng.shuffle([correct, ...ds]);
  const labels = "ABC";
  return {
    lines: opts.map((o, i) => `${labels[i]}) ${o}`),
    ans: labels[opts.indexOf(correct)]
  };
};

// ==================== 객관식 (구절 중심) ====================
const MC = {
  // [성경지식] 성경책 → 약자 고르기
  bookToAbbr(p) {
    const b = p.pickBook();
    const others = p.books.filter(x => x.약자 !== b.약자);
    const d = p.rng.sample(others, 2).map(x => x.약자);
    const {
      lines,
      ans
    } = mcOptions(p.rng, b.약자, d);
    return {
      tag: "성경책 약자",
      q: [`'${b.책이름}'의 약자로 알맞은 것은?`, ...lines],
      a: [`정답) ${ans} — ${b.약자}`],
      src: `성경책-${b.책이름}`
    };
  },
  // [성경지식] 약자 → 성경책 고르기
  abbrToBook(p) {
    const b = p.pickBook();
    const others = p.books.filter(x => x.책이름 !== b.책이름);
    const d = p.rng.sample(others, 2).map(x => x.책이름);
    const {
      lines,
      ans
    } = mcOptions(p.rng, b.책이름, d);
    return {
      tag: "성경책 약자",
      q: [`약자 '${b.약자}'는 어떤 성경책인가요?`, ...lines],
      a: [`정답) ${ans} — ${b.책이름}`],
      src: `성경책-${b.책이름}`
    };
  },
  // [성경지식] 다음 순서의 성경책 고르기
  nextBook(p) {
    const sameGroup = p.books.filter(x => x.구분 === p.books[0].구분);
    // 마지막 책 제외하고 뽑기
    const cands = p.books.filter(x => p.books.some(y => y.구분 === x.구분 && y.순번 === x.순번 + 1));
    const b = p.rng.choice(cands.length ? cands : p.books);
    const nextB = p.books.find(x => x.구분 === b.구분 && x.순번 === b.순번 + 1);
    if (!nextB) return MC.bookToAbbr(p); // 안전장치
    const others = p.books.filter(x => x.책이름 !== nextB.책이름 && x.책이름 !== b.책이름);
    const d = p.rng.sample(others, 2).map(x => x.책이름);
    const {
      lines,
      ans
    } = mcOptions(p.rng, nextB.책이름, d);
    return {
      tag: "성경책 순서",
      q: [`${b.구분}성경에서 '${b.책이름}' 다음에 오는 책은?`, ...lines],
      a: [`정답) ${ans} — ${nextB.책이름}`],
      src: `순서-${b.책이름}`
    };
  },
  // [성경지식] 권수/구분 문답
  bibleFact(p) {
    const f = p.pickFact();
    if (!f) return MC.bookToAbbr(p);
    // 권수 문답이면 그럴듯한 오답 생성
    let d;
    if (f.유형 === "권수") {
      const nums = ["27권", "39권", "66권", "40권", "24권"].filter(x => x !== f.답);
      d = p.rng.sample(nums, 2);
    } else {
      const otherFacts = p.facts.filter(x => x.답 !== f.답);
      d = p.rng.sample(otherFacts, Math.min(2, otherFacts.length)).map(x => x.답);
      while (d.length < 2) d.push(f.답 + " (오답)");
    }
    const {
      lines,
      ans
    } = mcOptions(p.rng, f.답, d);
    return {
      tag: "성경 상식",
      q: [f.질문, ...lines],
      a: [`정답) ${ans} — ${f.답}`],
      src: `상식-${f.질문.slice(0, 10)}`
    };
  },
  // 출처 보고 구절 뒷부분 완성
  completeVerse(p) {
    const r = p.pickRow(x => x.말씀.split(" ").length >= 6);
    const back = splitVerse(r.말씀)[1];
    const pool = p.rows.filter(x => x.ID !== r.ID).map(x => splitVerse(x.말씀)[1]);
    const d = p.otherRows(r, 2).map(x => splitVerse(x.말씀)[1]);
    const {
      lines,
      ans
    } = mcOptions(p.rng, back, d, pool);
    return {
      tag: "구절 완성",
      q: [`'${rowRef(r)}' 말씀의 뒷부분으로 알맞은 것은?`, `"${splitVerse(r.말씀)[0]} ..."`, ...lines],
      a: [`정답) ${ans}`],
      src: `${r.ID} ${rowRef(r)}`
    };
  },
  // 구절 보고 출처 찾기
  findSource(p) {
    const r = p.pickRow();
    const pool = p.rows.filter(x => rowRef(x) !== rowRef(r)).map(rowRef);
    const d = p.otherRows(r, 2).map(rowRef);
    const {
      lines,
      ans
    } = mcOptions(p.rng, rowRef(r), d, pool);
    return {
      tag: "출처 찾기",
      q: [`다음 말씀의 출처는 어디인가요?`, `"${r.말씀}"`, ...lines],
      a: [`정답) ${ans} — ${rowRef(r)}`],
      src: r.ID
    };
  },
  // 승급과정 구절 출처 찾기 (승급과정 우선)
  findSourcePromo(p) {
    const r = p.pickPromoRow();
    const pool = p.rows.filter(x => rowRef(x) !== rowRef(r)).map(rowRef);
    const d = p.otherRows(r, 2).map(rowRef);
    const {
      lines,
      ans
    } = mcOptions(p.rng, rowRef(r), d, pool);
    return {
      tag: "출처 찾기(승급)",
      q: [`다음 승급과정 말씀의 출처는?`, `"${r.말씀}"`, ...lines],
      a: [`정답) ${ans} — ${rowRef(r)}`],
      src: r.ID
    };
  },
  // 출처 보고 구절 첫부분 찾기
  findStart(p) {
    const r = p.pickRow(x => x.말씀.split(" ").length >= 5);
    const front = splitVerse(r.말씀)[0];
    const pool = p.rows.filter(x => x.ID !== r.ID).map(x => splitVerse(x.말씀)[0]);
    const d = p.otherRows(r, 2).map(x => splitVerse(x.말씀)[0]);
    const {
      lines,
      ans
    } = mcOptions(p.rng, front, d, pool);
    return {
      tag: "첫부분 찾기",
      q: [`'${rowRef(r)}' 말씀은 어떻게 시작하나요?`, ...lines],
      a: [`정답) ${ans}`],
      src: `${r.ID} ${rowRef(r)}`
    };
  },
  // SPARKS 글자 -> 영어단어 고르기
  sparksLetter(p) {
    const w = p.pickSparksWord();
    const others = p.sparksWords.filter(x => x.영어 !== w.영어);
    const d = p.rng.sample(others, 2).map(x => `${x.영어} (${x.뜻})`);
    const correct = `${w.영어} (${w.뜻})`;
    const {
      lines,
      ans
    } = mcOptions(p.rng, correct, d);
    return {
      tag: "SPARKS 단어",
      q: [`SPARKS 승급과정에서 '${w.글자}'에 해당하는 단어와 뜻은?`, ...lines],
      a: [`정답) ${ans} — ${w.영어} (${w.뜻})`],
      src: `SPARKS-${w.글자}`
    };
  },
  // SPARKS 영어단어 -> 뜻 고르기
  sparksMeaning(p) {
    const w = p.pickSparksWord();
    const others = p.sparksWords.filter(x => x.뜻 !== w.뜻);
    const d = p.rng.sample(others, 2).map(x => x.뜻);
    const {
      lines,
      ans
    } = mcOptions(p.rng, w.뜻, d);
    return {
