//    (students 목록은 건드리지 않음 → index.html과 덮어쓰기 충돌 없음)
//  · [✅ 어쩜조아에 확정]을 눌러야 그 주차 문서(week_N.teams)에 '임시 팀'으로 저장
//    공식 팀(students.team)은 바꾸지 않음 → 임시 팀이 없는 주차 점수는 그대로

const WEEK_DATES = ["8월 16일(테스트)","8월 23일","8월 30일","9월 6일","9월 13일","9월 20일","10월 4일","10월 11일","10월 18일","10월 25일","11월 1일","11월 8일","11월 15일","11월 22일","11월 29일","12월 6일"];

const TEAMS = [
  {id:"red",    name:"빨강", color:"#EF4444", light:"#FEF2F2", dot:"🔴"},
  {id:"blue",   name:"파랑", color:"#3B82F6", light:"#EFF6FF", dot:"🔵"},

const TNT_HB    = ["어드벤처1","어드벤처2","챌린지1","챌린지2"];
const DEPTS = [
  {id:"sparks", name:"스팍스", color:"#EF4444", hbs:SPARKS_HB},
  {id:"tnt",    name:"티앤티", color:"#16A34A", hbs:TNT_HB},
];

// ── 균형 기준 (필요하면 숫자만 조정) ──
const SPORT_DEFAULT = 2;     // 운동 점수 미입력 = 보통
const SPORT_TOL     = 2;     // 팀 간 운동 합 차이 허용치 (넘으면 크게 감점)
const RESTARTS      = 250;   // 부서별 시도 횟수
const TOP_K         = 8;     // 부서별 좋은 안 후보 수 (이 중에서 무작위 → 매번 다른 팀)

// ════════════════════════════════════
//  상태
// ════════════════════════════════════
const S = {
  user:null, loaded:false, pwErr:"",
  students:[], wdata:{}, closedWeeks:[], settingsLoaded:false,
  sport:{},            // {sid: 1|2|3}
  week:null,           // 팀을 짤 주차
  open:{sparks:true,tnt:true},
  pend:{sparks:null,tnt:null},   // 방금 짠 팀 (확정 전) — 클럽별
  view:"main",         // "main"(발표용) | "settings"(교사용)
};

// ════════════════════════════════════
//  주차·누적 계산 (index.html과 같은 기준)
// ════════════════════════════════════
function hasRealAward(a){
  if(!a) return false;
  return !!(a.enroll||a.badge||a.wing||a.award||((a.bibles||[]).length>0)||(a.gems>0)||((a.seals||[]).length>0));
}
function hasGameScore(g){
  return (g?.rounds||[]).some(r=>Object.values(r?.scores||{}).some(v=>(+v||0)!==0));
}
function weekHasActivity(wd){
  if(!wd) return false;
  if(wd.gameFinalized) return true;
  if(hasGameScore(wd.games?.sparks)||hasGameScore(wd.games?.tnt)) return true;
  if(wd.bonus&&Object.values(wd.bonus).some(v=>(+v||0)>0)) return true;
  return Object.values(wd.students||{}).some(d=>
    d.attendance===false || d.uniform===false ||
    ((+d.signs||0)>0) || d.memo || d.quizOnly || hasRealAward(d.awards));
}
// 통계 화면의 '암송 누적'과 같은 주차만 센다 (끝난 주차 + 실제 활동 있음, 테스트 제외)
function isCountedWeek(w){
  w=Number(w);
  if(w<=0) return false;
  const wd=S.wdata[w];
  if(!wd||!weekHasActivity(wd)) return false;
  return !!wd.gameFinalized || S.closedWeeks.includes(w);
}
function cumSigns(sid){
  let sum=0;
  WEEKS.forEach(w=>{
    if(!isCountedWeek(w)) return;
    const v=S.wdata[w]?.students?.[sid]?.signs||0;
    sum+=(typeof v==="number"?v:parseFloat(v)||0);
  });
  return Math.round(sum*10)/10;
}
function openWeek(){const o=WEEKS.filter(w=>w>0&&!S.closedWeeks.includes(w));return o.length===1?o[0]:null;}
function upcomingWeekByDate(){
  const p=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Seoul",month:"numeric",day:"numeric"}).formatToParts(new Date());
  const today=Number(p.find(x=>x.type==="month").value)*100+Number(p.find(x=>x.type==="day").value);
  let last=null;
  for(const w of WEEKS){
    if(w===0) continue;
    const m=/(\d+)월\s*(\d+)일/.exec(WEEK_DATES[w]||"");
    if(!m) continue;
    last=w;
    if(Number(m[1])*100+Number(m[2])>=today) return w;
  }
  return last;
}
function deptOf(s){
  if(SPARKS_HB.includes(s.handbook)) return "sparks";
  if(TNT_HB.includes(s.handbook)) return "tnt";
  return null;
}
function sportOf(sid){ const v=S.sport[sid]; return (v===1||v===2||v===3)?v:SPORT_DEFAULT; }
const r1=x=>Math.round(x*10)/10;
function gradeLabel(g){return g==="유"?"7세":(g?g+"학년":"");}

// 이번 주 출석한 아이들 (부서별)
function attendees(){
  const wd=S.wdata[S.week]||{};
  const out={sparks:[],tnt:[]};
  S.students.forEach(s=>{
    const d=deptOf(s); if(!d) return;
    if(!wd.students?.[s.id]?.attendance) return;
    out[d].push({id:s.id,name:s.name,grade:s.grade||"",handbook:s.handbook,sign:cumSigns(s.id),sport:sportOf(s.id)});
  });
  out.sparks.sort((a,b)=>a.name.localeCompare(b.name,"ko"));
  out.tnt.sort((a,b)=>a.name.localeCompare(b.name,"ko"));
  return out;
}

// ════════════════════════════════════
//  팀 나누기 알고리즘
// ════════════════════════════════════
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const range=arr=>arr.length?Math.max(...arr)-Math.min(...arr):0;

// 부서 안 4팀 비용: 암송 합 차이 + 운동 합 차이(허용치 넘으면 크게 감점)
function deptCost(kids,assign){
  const sg=[0,0,0,0], sp=[0,0,0,0];
  for(let i=0;i<kids.length;i++){ sg[assign[i]]+=kids[i].sign; sp[assign[i]]+=kids[i].sport; }
  const spR=range(sp);
  return range(sg) + 1000*Math.max(0,spR-SPORT_TOL) + 3*spR;
}
// 한 부서를 4팀으로: 무작위 시작 → 두 명 맞바꾸기로 개선 → 여러 번 반복해서 좋은 안 후보 모음
function solveDept(kids){
  const n=kids.length;
  if(!n) return [{teams:[[],[],[],[]],cost:0}];
  const seen=new Map();
  const idx=[...Array(n).keys()];
  for(let r=0;r<RESTARTS;r++){
    const perm=shuffle([0,1,2,3]);
    const assign=new Array(n);
    shuffle(idx).forEach((k,i)=>{assign[k]=perm[i%4];});   // 인원 차이 최대 1명
    let cur=deptCost(kids,assign), improved=true;
    while(improved){
      improved=false;
      for(const a of shuffle(idx)){
        for(const b of shuffle(idx)){
          if(assign[a]===assign[b]) continue;
          [assign[a],assign[b]]=[assign[b],assign[a]];
          const c=deptCost(kids,assign);
          if(c<cur-1e-9){cur=c;improved=true;}
          else [assign[a],assign[b]]=[assign[b],assign[a]];
        }
      }
    }
    const teams=[[],[],[],[]];
    assign.forEach((t,i)=>teams[t].push(kids[i]));
    const key=teams.map(t=>t.map(k=>k.id).sort().join(",")).sort().join("|");
    if(!seen.has(key)) seen.set(key,{teams,cost:cur});
  }
  return [...seen.values()].sort((a,b)=>a.cost-b.cost).slice(0,TOP_K);
}
function permutations(arr){
  if(arr.length<=1) return [arr];
  return arr.flatMap((x,i)=>permutations([...arr.slice(0,i),...arr.slice(i+1)]).map(p=>[x,...p]));
}
const PERMS=permutations([0,1,2,3]);
const sum=(list,f)=>list.reduce((s,k)=>s+f(k),0);
const OTHER={sparks:"tnt",tnt:"sparks"};
const clubName=c=>c==="sparks"?"스팍스":"티앤티";
const clubColor=c=>c==="sparks"?"#EF4444":"#16A34A";
const byName=(a,b)=>a.name.localeCompare(b.name,"ko");

// 색깔별 합산 비용 — base: 먼저 짠 다른 클럽 {팀id:[아이]}, add: 이번 클럽 {팀id:[아이]}
function comboCost(base,add){
  const sg=[],sp=[],ct=[];
  TEAMS.forEach(t=>{
    const l=[...(base?.[t.id]||[]),...(add[t.id]||[])];
    sg.push(sum(l,k=>k.sign)); sp.push(sum(l,k=>k.sport)); ct.push(l.length);
  });
  const spR=range(sp), ctR=range(ct);
  return range(sg) + 1000*Math.max(0,spR-SPORT_TOL) + 3*spR + 500*Math.max(0,ctR-1);
}
// 한 클럽만 팀 짜기.
//  · 클럽 안: 인원·누적 암송·운동 균형
//  · 다른 클럽 팀이 이미 있으면(확정됐거나 방금 짠 것) 그 팀들과 색깔별로 합쳤을 때 균형이 맞게 색깔을 배정
//  · 다른 클럽이 아직 없으면 색깔은 무작위 → 나중에 짜는 클럽이 맞춰 줌
function makeClubTeams(club){
  const kids=attendees()[club];
  const base=clubTeams(OTHER[club]);
  const opts=[];
  solveDept(kids).forEach(c=>{
    PERMS.forEach(p=>{
      const add={}; TEAMS.forEach((t,i)=>add[t.id]=[...c.teams[p[i]]].sort(byName));
      opts.push({cost:c.cost+(base?comboCost(base,add):0),add});
    });
  });
  opts.sort((a,b)=>a.cost-b.cost);
  const top=opts.slice(0,base?5:5*24);
  const pick=top[Math.floor(Math.random()*top.length)];
  return {week:S.week,club,teams:pick.add,matched:!!base};
}

// ════════════════════════════════════
//  저장
// ════════════════════════════════════
async function setSport(sid,v){
  const prev=S.sport[sid];
  S.sport={...S.sport,[sid]:v}; render();
  try{ await setDoc(doc(db,"awana","random"),{sport:{[sid]:v},_savedAt:Date.now()},{merge:true}); }
  catch(e){
    console.warn("운동 점수 저장 실패",e);
    S.sport={...S.sport,[sid]:prev}; render();
    toast("저장하지 못했어요. 다시 눌러 주세요");
  }
}
// ── 임시 팀: week_N.teams = {학생id: 팀id} (스팍스·티앤티 아이가 한 맵에 같이 들어감) ──
function savedMap(w=S.week){ const t=S.wdata[w]?.teams; return t&&Object.keys(t).length?t:null; }
// 확정된 한 클럽의 임시 팀 → {팀id:[아이]} (출석한 아이만), 없으면 null
function savedClub(club,w=S.week){
  const map=savedMap(w); if(!map) return null;
  const kids=attendees()[club].filter(k=>map[k.id]);
  if(!kids.length) return null;
  const out={}; TEAMS.forEach(t=>out[t.id]=kids.filter(k=>map[k.id]===t.id).sort(byName));
  return out;
}
function pendingOf(club){ const p=S.pend[club]; return p&&p.week===S.week?p:null; }
// 화면·균형 계산에 쓰는 팀: 방금 짠 것(확정 전)이 있으면 그것, 없으면 확정된 것
function clubTeams(club){ return pendingOf(club)?.teams||savedClub(club); }
function clubStatus(club){ return pendingOf(club)?"pending":savedClub(club)?"saved":"none"; }

async function confirmClub(club){
  const p=pendingOf(club); if(!p) return false;
  const w=p.week;
  if(S.closedWeeks.includes(w)){ alert(`${w}주차는 잠겨 있어요.\n어쩜조아에서 🔒을 열고 다시 눌러 주세요.`); return false; }
  const wd=S.wdata[w]||{};
  if(savedClub(club,w)&&!confirm(`${w}주차 ${clubName(club)}는 이미 확정한 임시 팀이 있어요.\n지금 팀으로 바꿀까요?`)) return false;
  if(hasGameScore(wd.games?.[club])&&
     !confirm(`⚠️ 이번 주 ${clubName(club)} 게임 점수가 이미 들어가 있어요.\n팀을 바꿔도 게임 점수는 색깔 기준으로 그대로 남아요.\n그래도 확정할까요?`)) return false;
  const old=wd.teams||{}, map={};
  // 다른 클럽 아이들의 임시 팀은 그대로 둔다
  S.students.forEach(s=>{ if(deptOf(s)!==club&&old[s.id]) map[s.id]=old[s.id]; });
  TEAMS.forEach(t=>(p.teams[t.id]||[]).forEach(k=>{map[k.id]=t.id;}));
  // 팀을 짠 뒤 확정 전에 출석한 아이 → 이 클럽에서 인원이 가장 적은 팀
  const att=attendees()[club];
  att.forEach(k=>{
    if(map[k.id]) return;
    const cnt={}; TEAMS.forEach(t=>cnt[t.id]=0);
    att.forEach(o=>{ if(map[o.id]) cnt[map[o.id]]++; });
    const min=Math.min(...Object.values(cnt));
    const cands=TEAMS.filter(t=>cnt[t.id]===min);
    map[k.id]=cands[Math.floor(Math.random()*cands.length)].id;
  });
  try{
    await updateDoc(doc(db,"awana",`week_${w}`),{teams:map,teamsAt:Date.now(),_savedAt:Date.now()});
    S.pend[club]=null; render();
    toast(`✅ ${w}주차 ${clubName(club)} 임시 팀 확정!`);
    return true;
  }catch(e){ console.warn("임시 팀 저장 실패",e); alert("저장하지 못했어요: "+e.message); return false; }
}
async function releaseClub(club){
  const w=S.week, map=savedMap(w); if(!map) return;
  if(S.closedWeeks.includes(w)){ alert(`${w}주차는 잠겨 있어요.`); return; }
  if(!confirm(`${w}주차 ${clubName(club)} 임시 팀을 해제할까요?\n${clubName(club)} 아이들은 공식 팀 기준으로 돌아가요.`)) return;
  const next={};
  S.students.forEach(s=>{ if(deptOf(s)!==club&&map[s.id]) next[s.id]=map[s.id]; });
  try{
    if(Object.keys(next).length) await updateDoc(doc(db,"awana",`week_${w}`),{teams:next,_savedAt:Date.now()});
    else await updateDoc(doc(db,"awana",`week_${w}`),{teams:deleteField(),teamsAt:deleteField(),_savedAt:Date.now()});
    toast(`${clubName(club)} 임시 팀을 해제했어요`);
  }catch(e){ alert("해제하지 못했어요: "+e.message); }
}

// ════════════════════════════════════
//  DOM 헬퍼
// ════════════════════════════════════
function el(tag,props={},...ch){
  const e=document.createElement(tag);
  Object.entries(props).forEach(([k,v])=>{
    if(k==="style"&&typeof v==="object") Object.assign(e.style,v);
    else if(k==="className") e.className=v;
    else if(k.startsWith("on")&&typeof v==="function") e.addEventListener(k.slice(2).toLowerCase(),v);
    else e.setAttribute(k,v);
  });
  ch.flat().forEach(c=>{if(c==null||c===false)return;e.appendChild(typeof c==="string"||typeof c==="number"?document.createTextNode(String(c)):c);});
  return e;
}
const D=(s,...c)=>el("div",{style:s},...c);
const SP=(s,...c)=>el("span",{style:s},...c);
const B=(s,fn,...c)=>el("button",{style:s,onClick:fn},...c);
function toast(msg){
  const prev=document.getElementById("_toast");if(prev)prev.remove();
  const t=el("div",{id:"_toast",style:{position:"fixed",bottom:"28px",left:"50%",transform:"translateX(-50%)",
    background:"#1E293B",color:"#fff",padding:"8px 20px",borderRadius:"20px",fontSize:"13px",fontWeight:"700",
    zIndex:"9999",pointerEvents:"none",whiteSpace:"nowrap",transition:"opacity 0.4s"}},msg);
  document.body.appendChild(t);
  setTimeout(()=>{t.style.opacity="0";setTimeout(()=>t.remove(),400);},1600);
}
function copyText(text,msg){
  const fallback=()=>{
    const ta=document.createElement("textarea");ta.value=text;ta.style.cssText="position:fixed;opacity:0";
    document.body.appendChild(ta);ta.select();
    try{document.execCommand("copy");toast(msg);}catch(e){alert(text);}
    document.body.removeChild(ta);
  };
  if(navigator.clipboard?.writeText) navigator.clipboard.writeText(text).then(()=>toast(msg)).catch(fallback);
  else fallback();
}

// ════════════════════════════════════
//  화면
// ════════════════════════════════════
function render(){
  const root=document.getElementById("root");
  root.innerHTML="";
  root.appendChild(!S.loaded?buildLoading():!S.user?buildLogin():buildMain());
}
function buildLoading(){

function buildLogin(){
  let pw="", busy=false;
  const input=el("input",{type:"password",placeholder:"비밀번호 입력",style:{width:"100%",padding:"14px",fontSize:"16px",
    borderRadius:"12px",border:"2px solid #E2E8F0",marginBottom:"10px",textAlign:"center",letterSpacing:"4px"}});
  input.addEventListener("input",()=>pw=input.value);
  const btn=B({width:"100%",background:"#1E293B",color:"#fff",border:"none",borderRadius:"12px",padding:"14px",
    fontWeight:"700",fontSize:"15px",cursor:"pointer"},()=>go(),"입장하기");
  async function go(){
    const p=pw.trim(); if(!p||busy) return;
    busy=true; btn.disabled=true; btn.textContent="확인 중...";
    let last=null;
    for(const email of ROLE_ACCOUNTS){
      try{ await signInWithEmailAndPassword(auth,email,p+PW_SUFFIX); S.pwErr=""; return; }
      catch(e){ last=e; if(e.code==="auth/too-many-requests"||e.code==="auth/network-request-failed") break; }
    }
    busy=false;
    S.pwErr=last?.code==="auth/too-many-requests"?"여러 번 틀려서 잠시 막혔어요.":last?.code==="auth/network-request-failed"?"인터넷 연결을 확인해 주세요.":"비밀번호가 올바르지 않아요.";
    render();
  }
  input.addEventListener("keydown",e=>{if(e.key==="Enter")go();});
  return D({background:"linear-gradient(135deg,#1E293B,#334155)",minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center"},
    D({background:"#fff",borderRadius:"24px",padding:"32px 28px",width:"320px",textAlign:"center"},
      D({fontSize:"40px",marginBottom:"6px"},"🎲"),
      D({fontWeight:"900",fontSize:"20px",marginBottom:"4px"},"랜덤 팀 짜기"),
      D({fontSize:"13px",color:"#94A3B8",marginBottom:"18px"},"어쩜조아 비밀번호로 들어와요"),
      input, S.pwErr?D({fontSize:"13px",color:"#EF4444",marginBottom:"10px"},S.pwErr):null, btn));
}

// ════════════════════════════════════
//  📺 팀 발표 화면 (클럽별)
//  ① 누르면 빈 대기 화면 (로고 + ▶ 시작) — 팀은 아직 안 짜짐
//  ② 시작 → 그 순간 그 클럽 팀을 짜고, 이름이 섞이다가 4팀이 동시에 좌라락 확정 (약 2.5초)
//  render()와 분리해 body에 직접 붙인다 (발표 중 데이터가 갱신돼도 화면이 끊기지 않게)
// ════════════════════════════════════
const SOUNDS={
  drumroll:"https://raw.githubusercontent.com/sydcawana/awana/main/sounds/drumroll.mp3",
  chime:"https://raw.githubusercontent.com/sydcawana/awana/main/sounds/chime.mp3",
};
const _au={};
function sound(key,on=true){
  try{
    if(!_au[key]) _au[key]=new Audio(SOUNDS[key]);
    const a=_au[key];
    if(on){a.currentTime=0;a.play().catch(()=>{});} else {a.pause();a.currentTime=0;}
  }catch(e){}
}
const SHUFFLE_MS=1200;   // 다 같이 섞이는 시간
const STEP_MS=80;        // 한 줄씩 확정되는 간격 (4팀 동시에)
let _ann=null;
function _annClear(){ if(!_ann) return; clearInterval(_ann.timer); _ann.timeouts.forEach(clearTimeout); _ann.timer=null; _ann.timeouts=[]; }
function closeAnnounce(){
  if(!_ann) return;
  _annClear(); sound("drumroll",false);
  _ann.wrap.remove(); _ann=null;
  document.removeEventListener("keydown",_annKey);
  if(document.fullscreenElement) document.exitFullscreen?.().catch(()=>{});
  render();
}
function _annKey(e){
  if(e.key==="Escape") closeAnnounce();
  else if((e.key===" "||e.key==="Enter")&&_ann&&_ann.state!=="running"){ e.preventDefault(); runAnnounce(); }
}
const btnStyle={border:"none",borderRadius:"14px",padding:"clamp(12px,1.6vh,18px) clamp(22px,2.6vw,40px)",
  fontWeight:"800",fontSize:"clamp(16px,1.8vw,24px)",cursor:"pointer"};

function openAnnounce(club){
  if(_ann) return;
  if(window.innerWidth>=900) document.documentElement.requestFullscreen?.().catch(()=>{});   // 모니터(PC)면 전체화면
  document.addEventListener("keydown",_annKey);
  const wrap=D({position:"fixed",inset:"0",background:"#fff",zIndex:"1000",display:"flex",flexDirection:"column",
    padding:"clamp(10px,2vw,28px)",boxSizing:"border-box",overflow:"auto"});
  document.body.appendChild(wrap);
  _ann={wrap,club,timer:null,timeouts:[],state:"standby"};
  showStandby();
}
// 대기 화면: 이름도 숫자도 없음

  const w=_ann.wrap, club=_ann.club; w.innerHTML="";

    img,
    D({fontWeight:"900",fontSize:"clamp(28px,5vw,64px)",color:"#1E293B",textAlign:"center"},
      SP({color:clubColor(club)},clubName(club))," 임시 팀 발표"),

      ...TEAMS.map(t=>D({width:"clamp(36px,5vw,70px)",height:"clamp(36px,5vw,70px)",borderRadius:"14px",background:t.color}))),
    B({...btnStyle,background:"linear-gradient(135deg,#7C3AED,#A855F7)",color:"#fff",

      ()=>runAnnounce(),"▶ 시작")));
}
// 시작: 이 순간 그 클럽 팀을 새로 짜고 발표 애니메이션
function runAnnounce(){
  if(!_ann) return;
  const club=_ann.club;
  _annClear(); _ann.state="running";
  S.pend[club]=makeClubTeams(club);
  const teams=S.pend[club].teams;
  const pool=attendees()[club].map(k=>k.name);
  const rnd=a=>a.length?a[Math.floor(Math.random()*a.length)]:"";
  const w=_ann.wrap; w.innerHTML="";

  const title=D({textAlign:"center",fontWeight:"900",fontSize:"clamp(22px,4vw,52px)",color:"#1E293B",
    marginBottom:"clamp(8px,1.5vh,20px)"},"🎲 ",SP({color:clubColor(club)},clubName(club))," 팀을 섞는 중...");
  const grid=D({flex:"1",display:"grid",gap:"clamp(8px,1.2vw,18px)",
    gridTemplateColumns:"repeat(auto-fit,minmax(min(100%,260px),1fr))",alignContent:"start"});
  const slotsByCard=[];
  TEAMS.forEach(t=>{
    const list=teams[t.id]||[];
    const box=D({display:"flex",flexDirection:"column",alignItems:"center",gap:"clamp(4px,0.8vh,10px)"});
    const slots=[];
    list.forEach(k=>{
      const s=SP({fontWeight:"800",fontSize:"clamp(22px,2.8vw,42px)",color:"#CBD5E1",whiteSpace:"nowrap",
        display:"inline-block",minWidth:"3.2em",textAlign:"center"},rnd(pool));
      box.appendChild(s); slots.push({el:s,final:k.name,done:false});
    });
    slotsByCard.push(slots);
    grid.appendChild(D({border:`clamp(3px,0.4vw,6px) solid ${t.color}`,borderRadius:"18px",background:t.light,
      padding:"clamp(10px,1.4vw,20px)",display:"flex",flexDirection:"column",gap:"clamp(8px,1.2vh,14px)"},
      D({fontWeight:"900",fontSize:"clamp(24px,3.2vw,48px)",color:t.color,textAlign:"center"},"임시 "+t.name+"팀"),
      D({background:"#fff",borderRadius:"12px",padding:"clamp(8px,1.2vh,14px)"},box)));
  });
  const bar=D({display:"flex",gap:"10px",justifyContent:"center",marginTop:"clamp(10px,2vh,24px)",visibility:"hidden"},
    B({...btnStyle,background:"#1E293B",color:"#fff"},()=>runAnnounce(),"🔀 다시 섞기"),
    B({...btnStyle,background:"#16A34A",color:"#fff"},async()=>{ if(await confirmClub(club)) closeAnnounce(); },"✅ 확정"),
    B({...btnStyle,background:"#F1F5F9",color:"#64748B"},closeAnnounce,"닫기"));
  const x=B({position:"fixed",top:"10px",right:"14px",background:"none",border:"none",fontSize:"26px",color:"#CBD5E1",cursor:"pointer",zIndex:"1001"},closeAnnounce,"×");
  w.appendChild(x); w.appendChild(title); w.appendChild(grid); w.appendChild(bar);

  sound("drumroll");
  _ann.timer=setInterval(()=>{
    slotsByCard.flat().forEach(s=>{ if(!s.done) s.el.textContent=rnd(pool); });
  },60);
  const maxLen=Math.max(0,...slotsByCard.map(s=>s.length));
  for(let i=0;i<maxLen;i++){
    _ann.timeouts.push(setTimeout(()=>{
      slotsByCard.forEach(slots=>{
        const s=slots[i]; if(!s) return;
        s.done=true; s.el.textContent=s.final;
        s.el.style.color="#1E293B"; s.el.className="pop";
      });
    },SHUFFLE_MS+i*STEP_MS));
  }
  _ann.timeouts.push(setTimeout(()=>{
    clearInterval(_ann.timer); _ann.state="done";
    sound("drumroll",false); sound("chime");
    title.innerHTML="";
    title.append("🎉 ",SP({color:clubColor(club)},clubName(club))," 임시 팀 발표!");
    bar.style.visibility="visible";
  },SHUFFLE_MS+maxLen*STEP_MS+150));
}

// ════════════════════════════════════
//  데이터 수신 (로그인 후에만)
// ════════════════════════════════════
let started=false;
function startListeners(){
  if(started) return; started=true;
  onSnapshot(doc(db,"awana","students"),snap=>{S.students=snap.exists()?(snap.data().list||[]):[];render();});
  onSnapshot(doc(db,"awana","settings"),snap=>{
    S.closedWeeks=snap.exists()?(snap.data().closedWeeks||[]):[];
    S.settingsLoaded=true; render();
  });
  onSnapshot(doc(db,"awana","random"),snap=>{S.sport=snap.exists()?(snap.data().sport||{}):{};render();},
    err=>console.warn("[random] 운동 점수 수신 실패",err));
  WEEKS.filter(w=>w>0).forEach(w=>{
    onSnapshot(doc(db,"awana",`week_${w}`),snap=>{S.wdata[w]=snap.exists()?snap.data():null;render();});
  });
}
onAuthStateChanged(auth,user=>{
  S.user=user||null;
  if(user) startListeners();
  S.loaded=true; render();
});
render();
</script>
